<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaseFile — Legal Case Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">⚖️</span>
      <div>
        <h1>CaseFile</h1>
        <p class="tagline">Private case &amp; matter management</p>
      </div>
    </div>
    <div class="header-actions">
      <input id="global-search" class="global-search" type="search"
             placeholder="Search clients, matters, documents…" autocomplete="off" />
      <button id="theme-toggle" class="btn ghost" title="Toggle theme">🌓</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="clients">Clients</button>
    <button class="tab" data-view="matters">Matters</button>
    <button class="tab" data-view="documents">Documents</button>
    <button class="tab" data-view="deadlines">Deadlines</button>
    <button class="tab" data-view="billing">Billing</button>
  </nav>

  <main id="main">
    <!-- Views are rendered here by app.js -->
  </main>

  <!-- Modal host -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button id="modal-close" class="btn ghost" aria-label="Close">✕</button>
      </div>
      <form id="modal-form" class="modal-body"></form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <footer class="app-footer">
    <span>Data stored locally in your browser — nothing is sent anywhere.</span>
    <span id="sync-status" class="sync-status">Cloud sync: not connected</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
