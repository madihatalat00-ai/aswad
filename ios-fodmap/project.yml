# XcodeGen spec — regenerates FODMAPAssistant.xcodeproj from the sources in
# FODMAPAssistant/. Use this if the checked-in .xcodeproj ever gets out of sync:
#   brew install xcodegen && cd ios-fodmap && xcodegen generate && open FODMAPAssistant.xcodeproj
name: FODMAPAssistant
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  FODMAPAssistant:
    type: application
    platform: iOS
    sources:
      - FODMAPAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FODMAPAssistant
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
